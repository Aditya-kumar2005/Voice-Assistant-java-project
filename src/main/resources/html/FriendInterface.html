<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My Friend Assistant 🤖</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <h1>My Friend Assistant 🤖</h1>
    
        <div id="jarvis-container" class="jarvis-container">         <div class="ring ring-3"></div>
        <div class="ring ring-4"></div>
        
        <div class="ring ring-1"></div> 
        <div class="ring ring-2"></div>
        
        <div class="ring ring-5"></div>
        <div class="ring ring-6"></div>
        
        <div class="jarvis-text">JARVIS</div> 
    </div>

        <div id="log">
        <span class="log-line">--- Command History ---</span>
        </div>
    
        <div class="controls">
        <button id="pauseBtn" onclick="javaCommand('pause')">Pause Listening</button>
        <button id="resumeBtn" onclick="javaCommand('resume')">Resume Listening</button>
        <button id="settingsBtn" onclick="javaCommand('settings')">Settings</button>
                <button id="clearBtn" onclick="clearChat()">Clear Chat</button> 
    </div>
    <script src="script.js"></script>
</body>
</html>
